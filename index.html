let categoria="Todos";

function filter(c,btn){
categoria=c;
document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
render();
}

function render(){
let q=document.getElementById("search").value.toLowerCase();
let lista=dados.filter(d=>
(categoria==="Todos"||d.tipo===categoria)&&
(d.nome+" "+d.ilha+" "+d.info+" "+d.tipo).toLowerCase().includes(q)
);
document.getElementById("results").innerHTML=lista.length?lista.map(d=>`
<div class="card">
<span class="tag">${d.tipo}</span>
<h3>${d.nome}</h3>
<p><b>Local:</b> ${d.ilha}</p>
<p>${d.info}</p>
</div>`).join(""):"<p>Nenhum resultado encontrado.</p>";
}
render();
